buildscript {
    ext {
        buildToolsVersion = "36.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        kotlinVersion = "2.1.20"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath("com.android.tools.build:gradle")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("com.google.gms:google-services:4.4.3")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin")
    }
}

apply plugin: "com.facebook.react.rootproject"

def configuredNodeBinary = file("node-binary.sh").absolutePath

subprojects { subproject ->
    subproject.plugins.withId("com.facebook.react") {
        subproject.tasks.withType(com.facebook.react.tasks.GenerateCodegenSchemaTask).configureEach {
            nodeExecutableAndArgs.set([configuredNodeBinary])
        }
        subproject.tasks.withType(com.facebook.react.tasks.GenerateCodegenArtifactsTask).configureEach {
            nodeExecutableAndArgs.set([configuredNodeBinary])
        }
        subproject.tasks.withType(com.facebook.react.tasks.BundleHermesCTask).configureEach {
            nodeExecutableAndArgs.set([configuredNodeBinary])
        }
    }
}
