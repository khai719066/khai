name: Android Beta Build

on:
  push:
    branches:
      - develop
      - staging
  workflow_dispatch:
    inputs:
      environment:
        description: Android environment to distribute
        required: true
        default: prod
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  build:
    # Lệnh này chỉ định GitHub Action chạy trên máy local của bạn (self-hosted runner)
    runs-on: self-hosted
    env:
      TARGET_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.environment || (github.ref_name == 'develop' && 'dev' || (github.ref_name == 'staging' && 'staging' || 'prod')) }}

    steps:
      # Bước 1: Kéo code mới nhất từ nhánh đang chạy workflow
      - name: Checkout Code
        uses: actions/checkout@v4

      # Bước 1.5: Cài đặt Node.js để build React Native Bundle
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Export Node binary for Gradle/Fastlane
        run: |
          echo "/opt/homebrew/opt/ruby/bin" >> "$GITHUB_PATH"
          echo "NODE_BINARY=$(which node)" >> "$GITHUB_ENV"
          echo "$(dirname "$(which node)")" >> "$GITHUB_PATH"

      - name: Debug build environment
        run: |
          pwd
          git rev-parse HEAD
          which node
          node -v
          echo "$NODE_BINARY"
          which ruby
          ruby -v
          which bundle || true
          bundle -v || true
          if [ -n "${FIREBASE_TOKEN:-}" ]; then echo "FIREBASE_TOKEN is set"; else echo "FIREBASE_TOKEN is missing"; fi
          echo "Target environment: ${TARGET_ENVIRONMENT}"
          sed -n '20,40p' android/fastlane/Fastfile
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          TARGET_ENVIRONMENT: ${{ env.TARGET_ENVIRONMENT }}

      # Bước 2: Cài đặt các thư viện React Native (nếu có thay đổi)
      - name: Install Node Modules
        run: yarn install

      - name: Install Fastlane gems
        working-directory: android
        run: |
          bundle config set path vendor/bundle
          bundle install

      # Bước 2.5: Copy các file bảo mật bị Git bỏ qua (keystore, local.properties) từ thư mục gốc
      - name: Copy Keystore and local.properties
        run: |
          cp /Users/nguyenquangkhai/kido/MyApp/android/local.properties android/local.properties
          cp /Users/nguyenquangkhai/kido/MyApp/android/app/my-upload-key.keystore android/app/my-upload-key.keystore

      # Bước 3: Chạy Fastlane để build và upload
      - name: Build and Upload to Firebase
        working-directory: android
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_APP_ID_DEV: ${{ secrets.FIREBASE_APP_ID_DEV }}
          FIREBASE_APP_ID_STAGING: ${{ secrets.FIREBASE_APP_ID_STAGING }}
          FIREBASE_APP_ID_PROD: ${{ secrets.FIREBASE_APP_ID_PROD }}
          NODE_BINARY: ${{ env.NODE_BINARY }}
          TARGET_ENVIRONMENT: ${{ env.TARGET_ENVIRONMENT }}
        run: bundle exec fastlane "beta_${TARGET_ENVIRONMENT}"
